<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>계산기</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #1a1a2e;
      font-family: 'Segoe UI', sans-serif;
    }

    .calculator {
      background: #16213e;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      width: 320px;
    }

    .display {
      background: #0f3460;
      border-radius: 12px;
      padding: 20px;
      text-align: right;
      margin-bottom: 20px;
    }

    .display .expression {
      color: #a8b2d8;
      font-size: 14px;
      min-height: 20px;
      margin-bottom: 8px;
    }

    .display .result {
      color: #e0e0e0;
      font-size: 36px;
      font-weight: 300;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 18px;
      font-size: 18px;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.1s;
    }

    button:active { transform: scale(0.93); opacity: 0.8; }

    .btn-number  { background: #1a1a4e; color: #e0e0e0; }
    .btn-op      { background: #533483; color: #fff; }
    .btn-equal   { background: #e94560; color: #fff; }
    .btn-clear   { background: #0f3460; color: #e0e0e0; }
    .btn-zero    { grid-column: span 2; }
  </style>
</head>
<body>
  <div class="calculator">
    <div class="display">
      <div class="expression" id="expression"></div>
      <div class="result" id="result">0</div>
    </div>
    <div class="buttons">
      <button class="btn-clear" onclick="clearAll()">AC</button>
      <button class="btn-clear" onclick="toggleSign()">+/-</button>
      <button class="btn-clear" onclick="percent()">%</button>
      <button class="btn-op"    onclick="op('/')">÷</button>

      <button class="btn-number" onclick="num('7')">7</button>
      <button class="btn-number" onclick="num('8')">8</button>
      <button class="btn-number" onclick="num('9')">9</button>
      <button class="btn-op"     onclick="op('*')">×</button>

      <button class="btn-number" onclick="num('4')">4</button>
      <button class="btn-number" onclick="num('5')">5</button>
      <button class="btn-number" onclick="num('6')">6</button>
      <button class="btn-op"     onclick="op('-')">−</button>

      <button class="btn-number" onclick="num('1')">1</button>
      <button class="btn-number" onclick="num('2')">2</button>
      <button class="btn-number" onclick="num('3')">3</button>
      <button class="btn-op"     onclick="op('+')">+</button>

      <button class="btn-number btn-zero" onclick="num('0')">0</button>
      <button class="btn-number" onclick="dot()">.</button>
      <button class="btn-equal"  onclick="calculate()">=</button>
    </div>
  </div>

  <script>
    let current = '0';
    let expression = '';
    let resetNext = false;

    const resultEl = document.getElementById('result');
    const expressionEl = document.getElementById('expression');

    function updateDisplay() {
      resultEl.textContent = current;
      expressionEl.textContent = expression;
    }

    function num(n) {
      if (resetNext) { current = n; resetNext = false; }
      else current = current === '0' ? n : current + n;
      updateDisplay();
    }

    function dot() {
      if (resetNext) { current = '0.'; resetNext = false; }
      else if (!current.includes('.')) current += '.';
      updateDisplay();
    }

    function op(o) {
      expression = current + ' ' + o;
      resetNext = true;
      updateDisplay();
    }

    function calculate() {
      if (!expression) return;
      const parts = expression.trim().split(' ');
      const a = parseFloat(parts[0]);
      const operator = parts[1];
      const b = parseFloat(current);
      let result;
      if (operator === '/') result = b !== 0 ? a / b : 'Error';
      else if (operator === '*') result = a * b;
      else if (operator === '+') result = a + b;
      else if (operator === '-') result = a - b;
      expressionEl.textContent = expression + ' ' + current + ' =';
      current = String(parseFloat(result.toFixed(10)));
      expression = '';
      resetNext = true;
      updateDisplay();
    }

    function clearAll() {
      current = '0'; expression = ''; resetNext = false;
      updateDisplay();
    }

    function toggleSign() {
      current = String(parseFloat(current) * -1);
      updateDisplay();
    }

    function percent() {
      current = String(parseFloat(current) / 100);
      updateDisplay();
    }
  </script>
</body>
</html>
